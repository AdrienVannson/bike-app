name: Typecheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# TODO: also type check the web app (app/web) and the db scripts (db/scripts).
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
