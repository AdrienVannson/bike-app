name: Audit

# TODO: re-enable automatic audits before going to production.
on:
  workflow_dispatch: # manual runs only for now
  # push:
  #   branches: [main]
  # pull_request:
  # schedule:
  #   - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          standalone: true
      - run: pnpm audit
