name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - name: Audit (fail on critical)
        run: pnpm audit --audit-level critical
      - name: Audit (warn on lower severities)
        run: |
          if ! pnpm audit > audit.txt 2>&1; then
            echo "::warning title=pnpm audit::Vulnerabilities found, see the job summary"
            { echo '## pnpm audit'; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
