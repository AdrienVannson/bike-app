version: 2
updates:
  # pnpm workspace: the root lockfile covers app/* and packages/*
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directories:
      - "/infra/envs/dev"
      - "/infra/envs/test"
      - "/infra/envs/prod"
      - "/infra/bootstrap"
    schedule:
      interval: "monthly"
    groups:
      terraform:
        patterns:
          - "*"
